# Two-service stack for local development, with hot-reload-friendly separation.
# The deployed build is a single service instead: see the root Dockerfile, which
# bundles the frontend into FastAPI so there is one port and one origin.
services:
  backend:
    build: ./backend
    ports:
      # bound to loopback: every endpoint is unauthenticated and triggering a
      # run spends real LLM credits, so do not expose this on a shared network
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    # no VITE_API_BASE_URL: the bundle uses same-origin relative paths and
    # nginx proxies /api to the backend service, so dev matches production
    depends_on:
      - backend
