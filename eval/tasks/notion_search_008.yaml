version: 1
task_id: notion_search_008
workflow_id: notion_search
instruction: 'A teammate asked in Slack channel roi-sandbox-questions (thread_ts {{ refs.question_thread
  }}): "Which pages cover onboarding for new engineers?". Query the Notion database knowledge_base using
  a filter on the Tags multi_select property (allowed tags: billing, hiring, infrastructure, legal, onboarding,
  security), then reply in that thread with an answer under 120 words that names every relevant page by
  its exact title and no other pages.'
inputs:
  kb_database: knowledge_base
  question: Which pages cover onboarding for new engineers?
  answer_channel: roi-sandbox-questions
  question_ts: '{{ refs.question_thread }}'
  tag_options:
  - billing
  - hiring
  - infrastructure
  - legal
  - onboarding
  - security
fixtures:
  slack:
    threads:
    - ref: question_thread
      channel: roi-sandbox-questions
      messages:
      - user: Felix
        text: Which pages cover onboarding for new engineers?
  notion:
    databases:
    - name: knowledge_base
      pages:
      - ref: page_01
        title: Tax Exemption Handling
        properties:
          Tags:
          - billing
          Summary: Exempt customers upload certificates before invoicing.
      - ref: page_02
        title: Open Source License Policy
        properties:
          Tags:
          - legal
          Summary: Copyleft licenses need legal review before use.
      - ref: page_03
        title: Dev Environment Setup
        properties:
          Tags:
          - onboarding
          Summary: Steps to clone the monorepo and run services locally.
      - ref: page_04
        title: Password Rotation Policy
        properties:
          Tags:
          - security
          Summary: Service passwords rotate every 90 days through Vault.
      - ref: page_05
        title: Incident Disclosure Process
        properties:
          Tags:
          - security
          Summary: Customer-facing incidents are disclosed within 72 hours.
      - ref: page_06
        title: Invoice Schedule
        properties:
          Tags:
          - billing
          Summary: Invoices are issued on the first business day of each month.
      - ref: page_07
        title: Referral Bonus Policy
        properties:
          Tags:
          - hiring
          Summary: Referral bonuses pay out after the hire's 90th day.
      - ref: page_08
        title: Buddy Program Guide
        properties:
          Tags:
          - onboarding
          Summary: Every new hire is paired with a buddy for 30 days.
      - ref: page_09
        title: New Hire First Week
        properties:
          Tags:
          - onboarding
          Summary: Day-by-day schedule for a new engineer's first week.
      - ref: page_10
        title: Kubernetes Upgrade Runbook
        properties:
          Tags:
          - infrastructure
          Summary: Clusters upgrade one minor version per quarter.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id001
      - Buddy Program Guide
      - New Hire First Week
      - Dev Environment Setup
  - name: message_excludes_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id002
      - Tax Exemption Handling
      - Password Rotation Policy
      - Invoice Schedule
      - Referral Bonus Policy
      - Kubernetes Upgrade Runbook
      - Open Source License Policy
      - Incident Disclosure Process
  step_checks:
    extract_filter:
    - check: json_field_equals
      args:
        field: tag
        value: onboarding
    compose_answer:
    - check: text_mentions_terms
      args:
        terms: *id001
    - check: text_excludes_terms
      args:
        terms: *id002
  gold_outputs:
    extract_filter:
      tag: onboarding
    query_kb:
      pages:
      - title: Buddy Program Guide
        properties:
          Tags:
          - onboarding
          Summary: Every new hire is paired with a buddy for 30 days.
      - title: New Hire First Week
        properties:
          Tags:
          - onboarding
          Summary: Day-by-day schedule for a new engineer's first week.
      - title: Dev Environment Setup
        properties:
          Tags:
          - onboarding
          Summary: Steps to clone the monorepo and run services locally.
