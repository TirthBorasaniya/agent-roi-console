expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-pipeline
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-pipeline
      terms:
      - Hooli Support Upgrade 1
      - Stark Multi-region Rollout 2
      - Gringotts Enterprise License 3
      - Umbrella Enterprise License 5
      - Hooli Platform Expansion 6
      - Stark Platform Expansion 7
  - name: message_mentions_amount
    args:
      channel: roi-sandbox-pipeline
      amount: 309000
  - name: crm_activity_logged
    args:
      contact: '{{ refs.p_2 }}'
      contains: pipeline
  step_checks:
    write_summary:
    - check: text_mentions_terms
      args:
        terms:
        - Hooli Support Upgrade 1
        - Stark Multi-region Rollout 2
        - Gringotts Enterprise License 3
        - Umbrella Enterprise License 5
        - Hooli Platform Expansion 6
        - Stark Platform Expansion 7
    - check: text_mentions_amount
      args:
        amount: 309000
    pick_followup:
    - check: json_field_equals
      args:
        field: contact_id
        value: '{{ refs.p_2 }}'
  gold_outputs: {}
