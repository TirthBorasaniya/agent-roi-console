      domain: umbrella.roi-sandbox.test
    people:
    - ref: p_1
      first_name: Lena
      last_name: Aziz
      email: lena.aziz@hooli.roi-sandbox.test
      company: co_1
      job_title: Procurement Lead
    - ref: p_2
      first_name: Diego
      last_name: Haddad
      email: diego.haddad@stark.roi-sandbox.test
