  crm:
    companies:
    - ref: co_1
      name: Hooli Media
      domain: hooli.roi-sandbox.test
    - ref: co_2
      name: Stark Analytics
      domain: stark.roi-sandbox.test
    - ref: co_3
      name: Gringotts Finance
      domain: gringotts.roi-sandbox.test
    - ref: co_4
      name: Tyrell Mobility
      domain: tyrell.roi-sandbox.test
    - ref: co_5
