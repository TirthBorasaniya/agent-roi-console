expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-pipeline
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-pipeline
      terms:
      - Tyrell Annual Renewal 1
      - Initech Enterprise License 2
      - Oscorp Support Upgrade 3
      - Wonka Platform Expansion 5
      - Tyrell Analytics Add-on 6
      - Initech Annual Renewal 7
  - name: message_mentions_amount
    args:
      channel: roi-sandbox-pipeline
      amount: 384000
  - name: crm_activity_logged
    args:
      contact: '{{ refs.p_5 }}'
      contains: pipeline
  step_checks:
    write_summary:
    - check: text_mentions_terms
      args:
        terms:
        - Tyrell Annual Renewal 1
        - Initech Enterprise License 2
        - Oscorp Support Upgrade 3
        - Wonka Platform Expansion 5
        - Tyrell Analytics Add-on 6
        - Initech Annual Renewal 7
    - check: text_mentions_amount
      args:
        amount: 384000
    pick_followup:
    - check: json_field_equals
      args:
        field: contact_id
        value: '{{ refs.p_5 }}'
  gold_outputs: {}
