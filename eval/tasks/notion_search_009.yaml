version: 1
task_id: notion_search_009
workflow_id: notion_search
instruction: 'A teammate asked in Slack channel roi-sandbox-questions (thread_ts {{ refs.question_thread
  }}): "A customer asked about billing, which pages explain our process?". Query the Notion database knowledge_base
  using a filter on the Tags multi_select property (allowed tags: billing, hiring, infrastructure, legal,
  onboarding, security), then reply in that thread with an answer under 120 words that names every relevant
  page by its exact title and no other pages.'
inputs:
  kb_database: knowledge_base
  question: A customer asked about billing, which pages explain our process?
  answer_channel: roi-sandbox-questions
  question_ts: '{{ refs.question_thread }}'
  tag_options:
  - billing
  - hiring
  - infrastructure
  - legal
  - onboarding
  - security
fixtures:
  slack:
    threads:
    - ref: question_thread
      channel: roi-sandbox-questions
      messages:
      - user: Diego
        text: A customer asked about billing, which pages explain our process?
  notion:
    databases:
    - name: knowledge_base
      pages:
      - ref: page_01
        title: Referral Bonus Policy
        properties:
          Tags:
          - hiring
          Summary: Referral bonuses pay out after the hire's 90th day.
      - ref: page_02
        title: Offer Approval Workflow
        properties:
          Tags:
          - hiring
          Summary: Offers above band need VP and finance sign-off.
      - ref: page_03
        title: Tax Exemption Handling
        properties:
          Tags:
          - billing
          Summary: Exempt customers upload certificates before invoicing.
      - ref: page_04
        title: Buddy Program Guide
        properties:
          Tags:
          - onboarding
          Summary: Every new hire is paired with a buddy for 30 days.
      - ref: page_05
        title: Backup Retention Matrix
        properties:
          Tags:
          - infrastructure
          Summary: Database backups are kept 35 days, snapshots 7 days.
      - ref: page_06
        title: Incident Disclosure Process
        properties:
          Tags:
          - security
          Summary: Customer-facing incidents are disclosed within 72 hours.
      - ref: page_07
        title: Invoice Schedule
        properties:
          Tags:
          - billing
          Summary: Invoices are issued on the first business day of each month.
      - ref: page_08
        title: Refund Approval Rules
        properties:
          Tags:
          - billing
          Summary: Refunds above 500 USD need finance approval.
      - ref: page_09
        title: Open Source License Policy
        properties:
          Tags:
          - legal
          Summary: Copyleft licenses need legal review before use.
      - ref: page_10
        title: Interview Scorecard Rubric
        properties:
          Tags:
          - hiring
          Summary: Candidates are scored 1 to 4 on four competencies.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id001
      - Tax Exemption Handling
      - Refund Approval Rules
      - Invoice Schedule
  - name: message_excludes_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id002
      - Backup Retention Matrix
      - Incident Disclosure Process
      - Open Source License Policy
      - Offer Approval Workflow
      - Interview Scorecard Rubric
      - Referral Bonus Policy
      - Buddy Program Guide
  step_checks:
    extract_filter:
    - check: json_field_equals
      args:
        field: tag
        value: billing
    compose_answer:
    - check: text_mentions_terms
      args:
        terms: *id001
    - check: text_excludes_terms
      args:
        terms: *id002
  gold_outputs:
    extract_filter:
      tag: billing
    query_kb:
      pages:
      - title: Tax Exemption Handling
        properties:
          Tags:
          - billing
          Summary: Exempt customers upload certificates before invoicing.
      - title: Refund Approval Rules
        properties:
          Tags:
          - billing
          Summary: Refunds above 500 USD need finance approval.
      - title: Invoice Schedule
        properties:
          Tags:
          - billing
          Summary: Invoices are issued on the first business day of each month.
