version: 1
task_id: slack_digest_011
workflow_id: slack_digest
instruction: Read the Slack thread with thread_ts {{ refs.thread_main }} in channel roi-sandbox-eng (a
  discussion about the hiring plan for platform). Write a digest under 150 words that lists every decision
  and every action item with its owner's name and due date exactly as written, then post the digest as
  a new message in channel roi-sandbox-digest.
inputs:
  source_channel: roi-sandbox-eng
  thread_ts: '{{ refs.thread_main }}'
  digest_channel: roi-sandbox-digest
  topic: the hiring plan for platform
fixtures:
  slack:
    threads:
    - ref: thread_main
      channel: roi-sandbox-eng
      messages:
      - user: Felix
        text: Kicking off a thread on the hiring plan for platform. We need to settle the first hire and
          the interview loop today.
      - user: Hana
        text: For the first hire I'd lean toward a manager first, but I'm open to two senior SREs.
      - user: Kenji
        text: two senior SREs is the safer choice given what we saw last quarter.
      - user: Felix
        text: 'Agreed. Decision: we go with two senior SREs for the first hire.'
      - user: Hana
        text: 'On the interview loop: five rounds was floated, but the group prefers a four-round loop.
          Decision: a four-round loop.'
      - user: Felix
        text: 'Action items: Hana will post the job descriptions by Oct 22.'
      - user: Kenji
        text: I'll train new interviewers by Feb 1.
      - user: Felix
        text: And Sofia is on point to book the recruiter sync by Jul 2.
      - user: Sofia
        text: Works for me, thanks all.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-digest
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-digest
      terms: &id001
      - two senior SREs
      - four-round loop
      - Hana
      - Kenji
      - Sofia
      - Oct 22
      - Feb 1
      - Jul 2
  step_checks:
    write_digest:
    - check: text_mentions_terms
      args:
        terms: *id001
  gold_outputs: {}
