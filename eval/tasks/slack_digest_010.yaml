version: 1
task_id: slack_digest_010
workflow_id: slack_digest
instruction: Read the Slack thread with thread_ts {{ refs.thread_main }} in channel roi-sandbox-eng (a
  discussion about the security audit findings). Write a digest under 150 words that lists every decision
  and every action item with its owner's name and due date exactly as written, then post the digest as
  a new message in channel roi-sandbox-digest.
inputs:
  source_channel: roi-sandbox-eng
  thread_ts: '{{ refs.thread_main }}'
  digest_channel: roi-sandbox-digest
  topic: the security audit findings
fixtures:
  slack:
    threads:
    - ref: thread_main
      channel: roi-sandbox-eng
      messages:
      - user: Marcus
        text: Kicking off a thread on the security audit findings. We need to settle the SSO requirement
          and secret storage today.
      - user: Daniel
        text: For the SSO requirement I'd lean toward optional SSO, but I'm open to mandatory SSO for
          admins.
      - user: Priya
        text: mandatory SSO for admins is the safer choice given what we saw last quarter.
      - user: Marcus
        text: 'Agreed. Decision: we go with mandatory SSO for admins for the SSO requirement.'
      - user: Daniel
        text: 'On secret storage: environment files was floated, but the group prefers HashiCorp Vault.
          Decision: HashiCorp Vault.'
      - user: Marcus
        text: 'Action items: Daniel will rotate the leaked keys by Jun 3.'
      - user: Priya
        text: I'll enable SSO enforcement by Apr 13.
      - user: Marcus
        text: And Lena is on point to file the audit response by May 21.
      - user: Lena
        text: Works for me, thanks all.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-digest
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-digest
      terms: &id001
      - mandatory SSO for admins
      - HashiCorp Vault
      - Daniel
      - Priya
      - Lena
      - Jun 3
      - Apr 13
      - May 21
  step_checks:
    write_digest:
    - check: text_mentions_terms
      args:
        terms: *id001
  gold_outputs: {}
