expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-pipeline
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-pipeline
      terms:
      - Wonka Multi-region Rollout 1
      - Stark Seat Expansion 2
      - Wonka Multi-region Rollout 6
  - name: message_mentions_amount
    args:
      channel: roi-sandbox-pipeline
      amount: 288500
  - name: crm_activity_logged
    args:
      contact: '{{ refs.p_1 }}'
      contains: pipeline
  step_checks:
    write_summary:
    - check: text_mentions_terms
      args:
        terms:
        - Wonka Multi-region Rollout 1
        - Stark Seat Expansion 2
        - Wonka Multi-region Rollout 6
    - check: text_mentions_amount
      args:
        amount: 288500
    pick_followup:
    - check: json_field_equals
      args:
        field: contact_id
        value: '{{ refs.p_1 }}'
  gold_outputs: {}
