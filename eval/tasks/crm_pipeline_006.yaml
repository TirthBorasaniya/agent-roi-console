version: 1
task_id: crm_pipeline_006
workflow_id: crm_pipeline
instruction: List the open CRM opportunities in stage PROPOSAL. Post a pipeline summary to Slack channel
  roi-sandbox-pipeline that names every one of those opportunities by its exact name with its amount and
  stage and states their total amount in USD. Then log a CRM activity on the point of contact of the opportunity
  with the largest amount, with a note that contains the word "pipeline".
inputs:
  stage: PROPOSAL
  summary_channel: roi-sandbox-pipeline
