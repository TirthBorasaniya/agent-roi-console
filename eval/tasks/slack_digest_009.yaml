version: 1
task_id: slack_digest_009
workflow_id: slack_digest
instruction: Read the Slack thread with thread_ts {{ refs.thread_main }} in channel roi-sandbox-eng (a
  discussion about the API versioning policy). Write a digest under 150 words that lists every decision
  and every action item with its owner's name and due date exactly as written, then post the digest as
  a new message in channel roi-sandbox-digest.
inputs:
  source_channel: roi-sandbox-eng
  thread_ts: '{{ refs.thread_main }}'
  digest_channel: roi-sandbox-digest
  topic: the API versioning policy
fixtures:
  slack:
    threads:
    - ref: thread_main
      channel: roi-sandbox-eng
      messages:
      - user: Nadia
        text: Kicking off a thread on the API versioning policy. We need to settle the version scheme
          and the deprecation window today.
      - user: Ingrid
        text: For the version scheme I'd lean toward URL path versions, but I'm open to date-based API
          versions.
      - user: Sofia
        text: date-based API versions is the safer choice given what we saw last quarter.
      - user: Nadia
        text: 'Agreed. Decision: we go with date-based API versions for the version scheme.'
      - user: Ingrid
        text: 'On the deprecation window: 3 months was floated, but the group prefers a 12-month deprecation
          window. Decision: a 12-month deprecation window.'
      - user: Nadia
        text: 'Action items: Ingrid will draft the policy doc by Jun 2.'
      - user: Sofia
        text: I'll add version headers by May 19.
      - user: Nadia
        text: And Tomas is on point to email partner developers by Feb 10.
      - user: Tomas
        text: Works for me, thanks all.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-digest
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-digest
      terms: &id001
      - date-based API versions
      - 12-month deprecation window
      - Ingrid
      - Sofia
      - Tomas
      - Jun 2
      - May 19
      - Feb 10
  step_checks:
    write_digest:
    - check: text_mentions_terms
      args:
        terms: *id001
  gold_outputs: {}
