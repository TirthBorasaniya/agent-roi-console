version: 1
task_id: notion_search_004
workflow_id: notion_search
instruction: 'A teammate asked in Slack channel roi-sandbox-questions (thread_ts {{ refs.question_thread
  }}): "Which infrastructure runbooks exist?". Query the Notion database knowledge_base using a filter
  on the Tags multi_select property (allowed tags: billing, hiring, infrastructure, legal, onboarding,
  security), then reply in that thread with an answer under 120 words that names every relevant page by
  its exact title and no other pages.'
inputs:
  kb_database: knowledge_base
  question: Which infrastructure runbooks exist?
  answer_channel: roi-sandbox-questions
  question_ts: '{{ refs.question_thread }}'
  tag_options:
  - billing
  - hiring
  - infrastructure
  - legal
  - onboarding
  - security
fixtures:
  slack:
    threads:
    - ref: question_thread
      channel: roi-sandbox-questions
      messages:
      - user: Elena
        text: Which infrastructure runbooks exist?
  notion:
    databases:
    - name: knowledge_base
      pages:
      - ref: page_01
        title: Dunning Email Sequence
        properties:
          Tags:
          - billing
          Summary: Failed payments trigger three reminder emails over 14 days.
      - ref: page_02
        title: Contract Signature Authority
        properties:
          Tags:
          - legal
          Summary: Only directors may sign contracts above 50,000 USD.
      - ref: page_03
        title: Data Processing Agreement
        properties:
          Tags:
          - legal
          Summary: The standard DPA covers GDPR and CCPA obligations.
      - ref: page_04
        title: Backup Retention Matrix
        properties:
          Tags:
          - infrastructure
          Summary: Database backups are kept 35 days, snapshots 7 days.
      - ref: page_05
        title: Kubernetes Upgrade Runbook
        properties:
          Tags:
          - infrastructure
          Summary: Clusters upgrade one minor version per quarter.
      - ref: page_06
        title: Buddy Program Guide
        properties:
          Tags:
          - onboarding
          Summary: Every new hire is paired with a buddy for 30 days.
      - ref: page_07
        title: Offer Approval Workflow
        properties:
          Tags:
          - hiring
          Summary: Offers above band need VP and finance sign-off.
      - ref: page_08
        title: Region Failover Plan
        properties:
          Tags:
          - infrastructure
          Summary: Traffic fails over to the secondary region within 15 minutes.
      - ref: page_09
        title: Referral Bonus Policy
        properties:
          Tags:
          - hiring
          Summary: Referral bonuses pay out after the hire's 90th day.
      - ref: page_10
        title: Laptop Encryption Standard
        properties:
          Tags:
          - security
          Summary: All laptops use full-disk encryption enforced by MDM.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id001
      - Region Failover Plan
      - Backup Retention Matrix
      - Kubernetes Upgrade Runbook
  - name: message_excludes_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id002
      - Laptop Encryption Standard
      - Buddy Program Guide
      - Referral Bonus Policy
      - Contract Signature Authority
      - Offer Approval Workflow
      - Dunning Email Sequence
      - Data Processing Agreement
  step_checks:
    extract_filter:
    - check: json_field_equals
      args:
        field: tag
        value: infrastructure
    compose_answer:
    - check: text_mentions_terms
      args:
        terms: *id001
    - check: text_excludes_terms
      args:
        terms: *id002
  gold_outputs:
    extract_filter:
      tag: infrastructure
    query_kb:
      pages:
      - title: Region Failover Plan
        properties:
          Tags:
          - infrastructure
          Summary: Traffic fails over to the secondary region within 15 minutes.
      - title: Backup Retention Matrix
        properties:
          Tags:
          - infrastructure
          Summary: Database backups are kept 35 days, snapshots 7 days.
      - title: Kubernetes Upgrade Runbook
        properties:
          Tags:
          - infrastructure
          Summary: Clusters upgrade one minor version per quarter.
