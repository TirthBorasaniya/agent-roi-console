version: 1
task_id: notion_search_006
workflow_id: notion_search
instruction: 'A teammate asked in Slack channel roi-sandbox-questions (thread_ts {{ refs.question_thread
  }}): "Which legal policies should I check before signing anything?". Query the Notion database knowledge_base
  using a filter on the Tags multi_select property (allowed tags: billing, hiring, infrastructure, legal,
  onboarding, security), then reply in that thread with an answer under 120 words that names every relevant
  page by its exact title and no other pages.'
inputs:
  kb_database: knowledge_base
  question: Which legal policies should I check before signing anything?
  answer_channel: roi-sandbox-questions
  question_ts: '{{ refs.question_thread }}'
  tag_options:
  - billing
  - hiring
  - infrastructure
  - legal
  - onboarding
  - security
fixtures:
  slack:
    threads:
    - ref: question_thread
      channel: roi-sandbox-questions
      messages:
      - user: Daniel
        text: Which legal policies should I check before signing anything?
  notion:
    databases:
    - name: knowledge_base
      pages:
      - ref: page_01
        title: Contract Signature Authority
        properties:
          Tags:
          - legal
          Summary: Only directors may sign contracts above 50,000 USD.
      - ref: page_02
        title: Interview Scorecard Rubric
        properties:
          Tags:
          - hiring
          Summary: Candidates are scored 1 to 4 on four competencies.
      - ref: page_03
        title: Open Source License Policy
        properties:
          Tags:
          - legal
          Summary: Copyleft licenses need legal review before use.
      - ref: page_04
        title: Laptop Encryption Standard
        properties:
          Tags:
          - security
          Summary: All laptops use full-disk encryption enforced by MDM.
      - ref: page_05
        title: Buddy Program Guide
        properties:
          Tags:
          - onboarding
          Summary: Every new hire is paired with a buddy for 30 days.
      - ref: page_06
        title: Region Failover Plan
        properties:
          Tags:
          - infrastructure
          Summary: Traffic fails over to the secondary region within 15 minutes.
      - ref: page_07
        title: Refund Approval Rules
        properties:
          Tags:
          - billing
          Summary: Refunds above 500 USD need finance approval.
      - ref: page_08
        title: Dev Environment Setup
        properties:
          Tags:
          - onboarding
          Summary: Steps to clone the monorepo and run services locally.
      - ref: page_09
        title: Incident Disclosure Process
        properties:
          Tags:
          - security
          Summary: Customer-facing incidents are disclosed within 72 hours.
      - ref: page_10
        title: Kubernetes Upgrade Runbook
        properties:
          Tags:
          - infrastructure
          Summary: Clusters upgrade one minor version per quarter.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id001
      - Contract Signature Authority
      - Open Source License Policy
  - name: message_excludes_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id002
      - Interview Scorecard Rubric
      - Kubernetes Upgrade Runbook
      - Buddy Program Guide
      - Region Failover Plan
      - Dev Environment Setup
      - Incident Disclosure Process
      - Refund Approval Rules
      - Laptop Encryption Standard
  step_checks:
    extract_filter:
    - check: json_field_equals
      args:
        field: tag
        value: legal
    compose_answer:
    - check: text_mentions_terms
      args:
        terms: *id001
    - check: text_excludes_terms
      args:
        terms: *id002
  gold_outputs:
    extract_filter:
      tag: legal
    query_kb:
      pages:
      - title: Contract Signature Authority
        properties:
          Tags:
          - legal
          Summary: Only directors may sign contracts above 50,000 USD.
      - title: Open Source License Policy
        properties:
          Tags:
          - legal
          Summary: Copyleft licenses need legal review before use.
