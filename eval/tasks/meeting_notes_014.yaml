version: 1
task_id: meeting_notes_014
workflow_id: meeting_notes
instruction: 'Create a page in the Notion database meeting_notes for the meeting notes below. Use the
  meeting title from the first line as the page title, set the Date property (YYYY-MM-DD) and the Attendees
  property (list of first names), then append blocks to the page: one paragraph block per decision and
  one to_do block per action item in the form "<Owner>: <task> (due <due>)". Notes: Customer Advisory
  Prep

  Held on July 1, 2026

  Attendees: Marcus, Omar, Hana, Ravi, Kenji


  Discussion

  Marcus opened with a status update. The group reviewed open risks and agreed:

  - Fund the observability upgrade

  - Adopt the new on-call handbook


  Next steps

  - Hana to fix the flaky integration test by Feb 14

  - Marcus to draft the customer announcement by Aug 7

  - Ravi to collect feedback from support by Mar 13

  '
inputs:
  meetings_database: meeting_notes
  notes: 'Customer Advisory Prep

    Held on July 1, 2026

    Attendees: Marcus, Omar, Hana, Ravi, Kenji


    Discussion

    Marcus opened with a status update. The group reviewed open risks and agreed:

    - Fund the observability upgrade

    - Adopt the new on-call handbook


    Next steps

    - Hana to fix the flaky integration test by Feb 14

    - Marcus to draft the customer announcement by Aug 7

    - Ravi to collect feedback from support by Mar 13

    '
fixtures:
  notion:
    databases:
    - name: meeting_notes
      pages: []
expected:
  validators:
  - name: notion_page_created
    args:
      database: meeting_notes
      title_contains: Customer Advisory Prep
  - name: notion_property_equals
    args:
      database: meeting_notes
      title_contains: Customer Advisory Prep
      property: Date
      value: '2026-07-01'
  - name: notion_todos_mention
    args:
      database: meeting_notes
      title_contains: Customer Advisory Prep
      terms: &id001
      - Hana
      - Marcus
      - Ravi
      min_todos: 3
  step_checks:
    extract_meeting:
    - check: json_field_contains
      args:
        field: title
        value: Customer Advisory Prep
    - check: json_field_equals
      args:
        field: date
        value: '2026-07-01'
    - check: json_list_equals
      args:
        field: attendees
        value:
        - Marcus
        - Omar
        - Hana
        - Ravi
        - Kenji
    - check: json_list_field_equals
      args:
        field: action_items
        key: owner
        value: *id001
  gold_outputs: {}
