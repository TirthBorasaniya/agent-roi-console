version: 1
task_id: slack_digest_006
workflow_id: slack_digest
instruction: Read the Slack thread with thread_ts {{ refs.thread_main }} in channel roi-sandbox-eng (a
  discussion about the design system refresh). Write a digest under 150 words that lists every decision
  and every action item with its owner's name and due date exactly as written, then post the digest as
  a new message in channel roi-sandbox-digest.
inputs:
  source_channel: roi-sandbox-eng
  thread_ts: '{{ refs.thread_main }}'
  digest_channel: roi-sandbox-digest
  topic: the design system refresh
fixtures:
  slack:
    threads:
    - ref: thread_main
      channel: roi-sandbox-eng
      messages:
      - user: Maya
        text: Kicking off a thread on the design system refresh. We need to settle the component library
          and the color tokens today.
      - user: Ravi
        text: For the component library I'd lean toward a fork of the old kit, but I'm open to Radix primitives.
      - user: Priya
        text: Radix primitives is the safer choice given what we saw last quarter.
      - user: Maya
        text: 'Agreed. Decision: we go with Radix primitives for the component library.'
      - user: Ravi
        text: 'On the color tokens: the legacy palette was floated, but the group prefers the new token
          set v2. Decision: the new token set v2.'
      - user: Maya
        text: 'Action items: Ravi will audit existing components by Dec 26.'
      - user: Priya
        text: I'll write the migration guide by Oct 25.
      - user: Maya
        text: And Jonah is on point to update Figma libraries by Sep 8.
      - user: Jonah
        text: Works for me, thanks all.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-digest
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-digest
      terms: &id001
      - Radix primitives
      - new token set v2
      - Ravi
      - Priya
      - Jonah
      - Dec 26
      - Oct 25
      - Sep 8
  step_checks:
    write_digest:
    - check: text_mentions_terms
      args:
        terms: *id001
  gold_outputs: {}
