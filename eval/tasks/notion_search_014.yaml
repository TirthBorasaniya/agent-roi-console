version: 1
task_id: notion_search_014
workflow_id: notion_search
instruction: 'A teammate asked in Slack channel roi-sandbox-questions (thread_ts {{ refs.question_thread
  }}): "What do we have documented about onboarding new hires?". Query the Notion database knowledge_base
  using a filter on the Tags multi_select property (allowed tags: billing, hiring, infrastructure, legal,
  onboarding), then reply in that thread with an answer under 120 words that names every relevant page
  by its exact title and no other pages.'
inputs:
  kb_database: knowledge_base
  question: What do we have documented about onboarding new hires?
  answer_channel: roi-sandbox-questions
  question_ts: '{{ refs.question_thread }}'
  tag_options:
  - billing
  - hiring
  - infrastructure
  - legal
  - onboarding
fixtures:
  slack:
    threads:
    - ref: question_thread
      channel: roi-sandbox-questions
      messages:
      - user: Diego
        text: What do we have documented about onboarding new hires?
  notion:
    databases:
    - name: knowledge_base
      pages:
      - ref: page_01
        title: Open Source License Policy
        properties:
          Tags:
          - legal
          Summary: Copyleft licenses need legal review before use.
      - ref: page_02
        title: Buddy Program Guide
        properties:
          Tags:
          - onboarding
          Summary: Every new hire is paired with a buddy for 30 days.
      - ref: page_03
        title: Region Failover Plan
        properties:
          Tags:
          - infrastructure
          Summary: Traffic fails over to the secondary region within 15 minutes.
      - ref: page_04
        title: Tax Exemption Handling
        properties:
          Tags:
          - billing
          Summary: Exempt customers upload certificates before invoicing.
      - ref: page_05
        title: Refund Approval Rules
        properties:
          Tags:
          - billing
          Summary: Refunds above 500 USD need finance approval.
      - ref: page_06
        title: Referral Bonus Policy
        properties:
          Tags:
          - hiring
          Summary: Referral bonuses pay out after the hire's 90th day.
      - ref: page_07
        title: Invoice Schedule
        properties:
          Tags:
          - billing
          Summary: Invoices are issued on the first business day of each month.
      - ref: page_08
        title: Dev Environment Setup
        properties:
          Tags:
          - onboarding
          Summary: Steps to clone the monorepo and run services locally.
      - ref: page_09
        title: Contract Signature Authority
        properties:
          Tags:
          - legal
          Summary: Only directors may sign contracts above 50,000 USD.
      - ref: page_10
        title: New Hire First Week
        properties:
          Tags:
          - onboarding
          Summary: Day-by-day schedule for a new engineer's first week.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id001
      - New Hire First Week
      - Buddy Program Guide
      - Dev Environment Setup
  - name: message_excludes_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id002
      - Open Source License Policy
      - Region Failover Plan
      - Referral Bonus Policy
      - Contract Signature Authority
      - Refund Approval Rules
      - Invoice Schedule
      - Tax Exemption Handling
  step_checks:
    extract_filter:
    - check: json_field_equals
      args:
        field: tag
        value: onboarding
    compose_answer:
    - check: text_mentions_terms
      args:
        terms: *id001
    - check: text_excludes_terms
      args:
        terms: *id002
  gold_outputs:
    extract_filter:
      tag: onboarding
    query_kb:
      pages:
      - title: New Hire First Week
        properties:
          Tags:
          - onboarding
          Summary: Day-by-day schedule for a new engineer's first week.
      - title: Buddy Program Guide
        properties:
          Tags:
          - onboarding
          Summary: Every new hire is paired with a buddy for 30 days.
      - title: Dev Environment Setup
        properties:
          Tags:
          - onboarding
          Summary: Steps to clone the monorepo and run services locally.
