    '
fixtures:
  notion:
    databases:
    - name: meeting_notes
      pages: []
expected:
  validators:
  - name: notion_page_created
    args:
      database: meeting_notes
      title_contains: Design Critique
  - name: notion_property_equals
    args:
      database: meeting_notes
      title_contains: Design Critique
      property: Date
      value: '2026-03-09'
  - name: notion_todos_mention
    args:
      database: meeting_notes
      title_contains: Design Critique
      terms: &id001
      - Nadia
      - Chloe
      - Daniel
      min_todos: 3
  step_checks:
    extract_meeting:
    - check: json_field_contains
      args:
        field: title
        value: Design Critique
    - check: json_field_equals
      args:
        field: date
        value: '2026-03-09'
    - check: json_list_equals
      args:
        field: attendees
        value:
        - Nadia
        - Hana
        - Chloe
        - Daniel
    - check: json_list_field_equals
      args:
        field: action_items
        key: owner
        value: *id001
  gold_outputs: {}
