expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-pipeline
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-pipeline
      terms:
      - Tyrell Pilot Program 1
      - Vandelay Analytics Add-on 2
      - Acme Support Upgrade 3
      - Wonka Annual Renewal 4
      - Pied Support Upgrade 5
      - Vandelay Enterprise License 7
  - name: message_mentions_amount
    args:
      channel: roi-sandbox-pipeline
      amount: 450500
  - name: crm_activity_logged
    args:
      contact: '{{ refs.p_5 }}'
      contains: pipeline
  step_checks:
    write_summary:
    - check: text_mentions_terms
      args:
        terms:
        - Tyrell Pilot Program 1
        - Vandelay Analytics Add-on 2
        - Acme Support Upgrade 3
        - Wonka Annual Renewal 4
        - Pied Support Upgrade 5
        - Vandelay Enterprise License 7
    - check: text_mentions_amount
      args:
        amount: 450500
    pick_followup:
    - check: json_field_equals
      args:
        field: contact_id
        value: '{{ refs.p_5 }}'
  gold_outputs: {}
