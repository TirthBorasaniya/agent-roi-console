version: 1
task_id: notion_search_001
workflow_id: notion_search
instruction: 'A teammate asked in Slack channel roi-sandbox-questions (thread_ts {{ refs.question_thread
  }}): "What are our security policies for credentials and devices?". Query the Notion database knowledge_base
  using a filter on the Tags multi_select property (allowed tags: billing, hiring, infrastructure, onboarding,
  security), then reply in that thread with an answer under 120 words that names every relevant page by
  its exact title and no other pages.'
inputs:
  kb_database: knowledge_base
  question: What are our security policies for credentials and devices?
  answer_channel: roi-sandbox-questions
  question_ts: '{{ refs.question_thread }}'
  tag_options:
  - billing
  - hiring
  - infrastructure
  - onboarding
  - security
fixtures:
  slack:
    threads:
    - ref: question_thread
      channel: roi-sandbox-questions
      messages:
      - user: Hana
        text: What are our security policies for credentials and devices?
  notion:
    databases:
    - name: knowledge_base
      pages:
      - ref: page_01
        title: Dunning Email Sequence
        properties:
          Tags:
          - billing
          Summary: Failed payments trigger three reminder emails over 14 days.
      - ref: page_02
        title: Kubernetes Upgrade Runbook
        properties:
          Tags:
          - infrastructure
          Summary: Clusters upgrade one minor version per quarter.
      - ref: page_03
        title: Access Review Checklist
        properties:
          Tags:
          - security
          Summary: Admin access is reviewed quarterly by each team lead.
      - ref: page_04
        title: Password Rotation Policy
        properties:
          Tags:
          - security
          Summary: Service passwords rotate every 90 days through Vault.
      - ref: page_05
        title: Buddy Program Guide
        properties:
          Tags:
          - onboarding
          Summary: Every new hire is paired with a buddy for 30 days.
      - ref: page_06
        title: Interview Scorecard Rubric
        properties:
          Tags:
          - hiring
          Summary: Candidates are scored 1 to 4 on four competencies.
      - ref: page_07
        title: Dev Environment Setup
        properties:
          Tags:
          - onboarding
          Summary: Steps to clone the monorepo and run services locally.
      - ref: page_08
        title: Region Failover Plan
        properties:
          Tags:
          - infrastructure
          Summary: Traffic fails over to the secondary region within 15 minutes.
      - ref: page_09
        title: Backup Retention Matrix
        properties:
          Tags:
          - infrastructure
          Summary: Database backups are kept 35 days, snapshots 7 days.
      - ref: page_10
        title: Tax Exemption Handling
        properties:
          Tags:
          - billing
          Summary: Exempt customers upload certificates before invoicing.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id001
      - Access Review Checklist
      - Password Rotation Policy
  - name: message_excludes_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id002
      - Region Failover Plan
      - Kubernetes Upgrade Runbook
      - Dunning Email Sequence
      - Interview Scorecard Rubric
      - Buddy Program Guide
      - Tax Exemption Handling
      - Dev Environment Setup
      - Backup Retention Matrix
  step_checks:
    extract_filter:
    - check: json_field_equals
      args:
        field: tag
        value: security
    compose_answer:
    - check: text_mentions_terms
      args:
        terms: *id001
    - check: text_excludes_terms
      args:
        terms: *id002
  gold_outputs:
    extract_filter:
      tag: security
    query_kb:
      pages:
      - title: Access Review Checklist
        properties:
          Tags:
          - security
          Summary: Admin access is reviewed quarterly by each team lead.
      - title: Password Rotation Policy
        properties:
          Tags:
          - security
          Summary: Service passwords rotate every 90 days through Vault.
