    - check: text_mentions_terms
      args:
        terms:
        - Gringotts Analytics Add-on 1
        - Tyrell Pilot Program 3
        - Oscorp Pilot Program 4
        - Stark Platform Expansion 5
        - Gringotts Platform Expansion 6
        - Vandelay Pilot Program 7
