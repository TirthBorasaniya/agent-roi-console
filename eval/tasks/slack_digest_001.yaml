version: 1
task_id: slack_digest_001
workflow_id: slack_digest
instruction: Read the Slack thread with thread_ts {{ refs.thread_main }} in channel roi-sandbox-eng (a
  discussion about the billing database migration). Write a digest under 150 words that lists every decision
  and every action item with its owner's name and due date exactly as written, then post the digest as
  a new message in channel roi-sandbox-digest.
inputs:
  source_channel: roi-sandbox-eng
  thread_ts: '{{ refs.thread_main }}'
  digest_channel: roi-sandbox-digest
  topic: the billing database migration
fixtures:
  slack:
    threads:
    - ref: thread_main
      channel: roi-sandbox-eng
      messages:
      - user: Lena
        text: Kicking off a thread on the billing database migration. We need to settle the target database
          and the cutover window today.
      - user: Samir
        text: For the target database I'd lean toward MySQL 8, but I'm open to Postgres 16.
      - user: Marcus
        text: Postgres 16 is the safer choice given what we saw last quarter.
      - user: Lena
        text: 'Agreed. Decision: we go with Postgres 16 for the target database.'
      - user: Samir
        text: 'On the cutover window: a weekday evening was floated, but the group prefers Saturday 02:00
          UTC. Decision: Saturday 02:00 UTC.'
      - user: Lena
        text: 'Action items: Samir will write the rollback runbook by Apr 26.'
      - user: Marcus
        text: I'll run the dry-run migration by Dec 10.
      - user: Lena
        text: And Diego is on point to notify finance by Sep 3.
      - user: Diego
        text: Works for me, thanks all.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-digest
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-digest
      terms: &id001
      - Postgres 16
      - Saturday 02:00 UTC
      - Samir
      - Marcus
      - Diego
      - Apr 26
      - Dec 10
      - Sep 3
  step_checks:
    write_digest:
    - check: text_mentions_terms
      args:
        terms: *id001
  gold_outputs: {}
