version: 1
task_id: notion_search_003
workflow_id: notion_search
instruction: 'A teammate asked in Slack channel roi-sandbox-questions (thread_ts {{ refs.question_thread
  }}): "Where are the billing rules documented?". Query the Notion database knowledge_base using a filter
  on the Tags multi_select property (allowed tags: billing, hiring, infrastructure, legal, security),
  then reply in that thread with an answer under 120 words that names every relevant page by its exact
  title and no other pages.'
inputs:
  kb_database: knowledge_base
  question: Where are the billing rules documented?
  answer_channel: roi-sandbox-questions
  question_ts: '{{ refs.question_thread }}'
  tag_options:
  - billing
  - hiring
  - infrastructure
  - legal
  - security
fixtures:
  slack:
    threads:
    - ref: question_thread
      channel: roi-sandbox-questions
      messages:
      - user: Aisha
        text: Where are the billing rules documented?
  notion:
    databases:
    - name: knowledge_base
      pages:
      - ref: page_01
        title: Contract Signature Authority
        properties:
          Tags:
          - legal
          Summary: Only directors may sign contracts above 50,000 USD.
      - ref: page_02
        title: Tax Exemption Handling
        properties:
          Tags:
          - billing
          Summary: Exempt customers upload certificates before invoicing.
      - ref: page_03
        title: Referral Bonus Policy
        properties:
          Tags:
          - hiring
          Summary: Referral bonuses pay out after the hire's 90th day.
      - ref: page_04
        title: Region Failover Plan
        properties:
          Tags:
          - infrastructure
          Summary: Traffic fails over to the secondary region within 15 minutes.
      - ref: page_05
        title: Offer Approval Workflow
        properties:
          Tags:
          - hiring
          Summary: Offers above band need VP and finance sign-off.
      - ref: page_06
        title: Refund Approval Rules
        properties:
          Tags:
          - billing
          Summary: Refunds above 500 USD need finance approval.
      - ref: page_07
        title: Backup Retention Matrix
        properties:
          Tags:
          - infrastructure
          Summary: Database backups are kept 35 days, snapshots 7 days.
      - ref: page_08
        title: Access Review Checklist
        properties:
          Tags:
          - security
          Summary: Admin access is reviewed quarterly by each team lead.
      - ref: page_09
        title: Data Processing Agreement
        properties:
          Tags:
          - legal
          Summary: The standard DPA covers GDPR and CCPA obligations.
      - ref: page_10
        title: Interview Scorecard Rubric
        properties:
          Tags:
          - hiring
          Summary: Candidates are scored 1 to 4 on four competencies.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id001
      - Refund Approval Rules
      - Tax Exemption Handling
  - name: message_excludes_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id002
      - Backup Retention Matrix
      - Offer Approval Workflow
      - Access Review Checklist
      - Interview Scorecard Rubric
      - Region Failover Plan
      - Contract Signature Authority
      - Referral Bonus Policy
      - Data Processing Agreement
  step_checks:
    extract_filter:
    - check: json_field_equals
      args:
        field: tag
        value: billing
    compose_answer:
    - check: text_mentions_terms
      args:
        terms: *id001
    - check: text_excludes_terms
      args:
        terms: *id002
  gold_outputs:
    extract_filter:
      tag: billing
    query_kb:
      pages:
      - title: Refund Approval Rules
        properties:
          Tags:
          - billing
          Summary: Refunds above 500 USD need finance approval.
      - title: Tax Exemption Handling
        properties:
          Tags:
          - billing
          Summary: Exempt customers upload certificates before invoicing.
