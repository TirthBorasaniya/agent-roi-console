expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-pipeline
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-pipeline
      terms:
      - Initech Enterprise License 1
      - Wayne Multi-region Rollout 2
  - name: message_mentions_amount
    args:
      channel: roi-sandbox-pipeline
      amount: 182000
  - name: crm_activity_logged
    args:
      contact: '{{ refs.p_1 }}'
      contains: pipeline
  step_checks:
