    - check: text_mentions_terms
      args:
        terms:
        - Initech Enterprise License 1
        - Wayne Multi-region Rollout 2
    - check: text_mentions_amount
      args:
        amount: 182000
    pick_followup:
    - check: json_field_equals
      args:
        field: contact_id
        value: '{{ refs.p_1 }}'
  gold_outputs: {}
