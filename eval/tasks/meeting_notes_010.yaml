version: 1
task_id: meeting_notes_010
workflow_id: meeting_notes
instruction: 'Create a page in the Notion database meeting_notes for the meeting notes below. Use the
  meeting title from the first line as the page title, set the Date property (YYYY-MM-DD) and the Attendees
  property (list of first names), then append blocks to the page: one paragraph block per decision and
  one to_do block per action item in the form "<Owner>: <task> (due <due>)". Notes: Quarterly Business
  Review

  Held on February 6, 2026

  Attendees: Sofia, Samir, Felix, Elena, Ingrid


  Discussion

  Sofia opened with a status update. The group reviewed open risks and agreed:

  - Move the launch to the second week of the month

  - Run the beta with five design partners


  Next steps

  - Elena to prepare the budget estimate by Nov 28

  - Ingrid to send the recap to stakeholders by Feb 6

  - Samir to file the vendor security review by Jan 22

  '
inputs:
  meetings_database: meeting_notes
  notes: 'Quarterly Business Review

    Held on February 6, 2026

    Attendees: Sofia, Samir, Felix, Elena, Ingrid


    Discussion

    Sofia opened with a status update. The group reviewed open risks and agreed:

    - Move the launch to the second week of the month

    - Run the beta with five design partners


    Next steps

    - Elena to prepare the budget estimate by Nov 28

    - Ingrid to send the recap to stakeholders by Feb 6

    - Samir to file the vendor security review by Jan 22

    '
fixtures:
  notion:
    databases:
    - name: meeting_notes
      pages: []
expected:
  validators:
  - name: notion_page_created
    args:
      database: meeting_notes
      title_contains: Quarterly Business Review
  - name: notion_property_equals
    args:
      database: meeting_notes
      title_contains: Quarterly Business Review
      property: Date
      value: '2026-02-06'
  - name: notion_todos_mention
    args:
      database: meeting_notes
      title_contains: Quarterly Business Review
      terms: &id001
      - Elena
      - Ingrid
      - Samir
      min_todos: 3
  step_checks:
    extract_meeting:
    - check: json_field_contains
      args:
        field: title
        value: Quarterly Business Review
    - check: json_field_equals
      args:
        field: date
        value: '2026-02-06'
    - check: json_list_equals
      args:
        field: attendees
        value:
        - Sofia
        - Samir
        - Felix
        - Elena
        - Ingrid
    - check: json_list_field_equals
      args:
        field: action_items
        key: owner
        value: *id001
  gold_outputs: {}
