version: 1
task_id: meeting_notes_013
workflow_id: meeting_notes
instruction: 'Create a page in the Notion database meeting_notes for the meeting notes below. Use the
  meeting title from the first line as the page title, set the Date property (YYYY-MM-DD) and the Attendees
  property (list of first names), then append blocks to the page: one paragraph block per decision and
  one to_do block per action item in the form "<Owner>: <task> (due <due>)". Notes: Incident Postmortem

  Held on May 7, 2026

  Attendees: Kenji, Priya, Ingrid, Marcus


  Discussion

  Kenji opened with a status update. The group reviewed open risks and agreed:

  - Require design review for every new screen

  - Fund the observability upgrade


  Next steps

  - Marcus to update the roadmap slide by Aug 23

  - Priya to send the recap to stakeholders by Dec 9

  '
inputs:
  meetings_database: meeting_notes
  notes: 'Incident Postmortem

    Held on May 7, 2026

    Attendees: Kenji, Priya, Ingrid, Marcus


    Discussion

    Kenji opened with a status update. The group reviewed open risks and agreed:

    - Require design review for every new screen

    - Fund the observability upgrade


    Next steps

    - Marcus to update the roadmap slide by Aug 23

    - Priya to send the recap to stakeholders by Dec 9

    '
fixtures:
  notion:
    databases:
    - name: meeting_notes
      pages: []
expected:
  validators:
  - name: notion_page_created
    args:
      database: meeting_notes
      title_contains: Incident Postmortem
  - name: notion_property_equals
    args:
      database: meeting_notes
      title_contains: Incident Postmortem
      property: Date
      value: '2026-05-07'
  - name: notion_todos_mention
    args:
      database: meeting_notes
      title_contains: Incident Postmortem
      terms: &id001
      - Marcus
      - Priya
      min_todos: 2
  step_checks:
    extract_meeting:
    - check: json_field_contains
      args:
        field: title
        value: Incident Postmortem
    - check: json_field_equals
      args:
        field: date
        value: '2026-05-07'
    - check: json_list_equals
      args:
        field: attendees
        value:
        - Kenji
        - Priya
        - Ingrid
        - Marcus
    - check: json_list_field_equals
      args:
        field: action_items
        key: owner
        value: *id001
  gold_outputs: {}
