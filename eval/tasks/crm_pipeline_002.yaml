expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-pipeline
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-pipeline
      terms:
      - Hooli Annual Renewal 1
      - Wayne Annual Renewal 2
  - name: message_mentions_amount
    args:
      channel: roi-sandbox-pipeline
      amount: 162000
  - name: crm_activity_logged
    args:
      contact: '{{ refs.p_1 }}'
      contains: pipeline
  step_checks:
    write_summary:
    - check: text_mentions_terms
      args:
        terms:
        - Hooli Annual Renewal 1
        - Wayne Annual Renewal 2
    - check: text_mentions_amount
      args:
        amount: 162000
    pick_followup:
    - check: json_field_equals
      args:
        field: contact_id
        value: '{{ refs.p_1 }}'
  gold_outputs: {}
