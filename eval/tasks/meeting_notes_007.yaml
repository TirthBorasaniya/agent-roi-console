version: 1
task_id: meeting_notes_007
workflow_id: meeting_notes
instruction: 'Create a page in the Notion database meeting_notes for the meeting notes below. Use the
  meeting title from the first line as the page title, set the Date property (YYYY-MM-DD) and the Attendees
  property (list of first names), then append blocks to the page: one paragraph block per decision and
  one to_do block per action item in the form "<Owner>: <task> (due <due>)". Notes: Infrastructure Planning

  Held on March 23, 2026

  Attendees: Kenji, Jonah, Omar, Felix


  Discussion

  Kenji opened with a status update. The group reviewed open risks and agreed:

  - Keep the current pricing for enterprise

  - Require design review for every new screen


  Next steps

  - Jonah to send the recap to stakeholders by Feb 27

  - Kenji to schedule the follow-up session by Nov 28

  '
inputs:
  meetings_database: meeting_notes
  notes: 'Infrastructure Planning

    Held on March 23, 2026

    Attendees: Kenji, Jonah, Omar, Felix


    Discussion

    Kenji opened with a status update. The group reviewed open risks and agreed:

    - Keep the current pricing for enterprise

    - Require design review for every new screen


    Next steps

    - Jonah to send the recap to stakeholders by Feb 27

    - Kenji to schedule the follow-up session by Nov 28

    '
fixtures:
  notion:
    databases:
    - name: meeting_notes
      pages: []
expected:
  validators:
  - name: notion_page_created
    args:
      database: meeting_notes
      title_contains: Infrastructure Planning
  - name: notion_property_equals
    args:
      database: meeting_notes
      title_contains: Infrastructure Planning
      property: Date
      value: '2026-03-23'
  - name: notion_todos_mention
    args:
      database: meeting_notes
      title_contains: Infrastructure Planning
      terms: &id001
      - Jonah
      - Kenji
      min_todos: 2
  step_checks:
    extract_meeting:
    - check: json_field_contains
      args:
        field: title
        value: Infrastructure Planning
    - check: json_field_equals
      args:
        field: date
        value: '2026-03-23'
    - check: json_list_equals
      args:
        field: attendees
        value:
        - Kenji
        - Jonah
        - Omar
        - Felix
    - check: json_list_field_equals
      args:
        field: action_items
        key: owner
        value: *id001
  gold_outputs: {}
