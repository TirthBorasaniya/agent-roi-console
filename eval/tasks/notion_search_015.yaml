version: 1
task_id: notion_search_015
workflow_id: notion_search
instruction: 'A teammate asked in Slack channel roi-sandbox-questions (thread_ts {{ refs.question_thread
  }}): "What billing policies do we have written down?". Query the Notion database knowledge_base using
  a filter on the Tags multi_select property (allowed tags: billing, hiring, infrastructure, legal, security),
  then reply in that thread with an answer under 120 words that names every relevant page by its exact
  title and no other pages.'
inputs:
  kb_database: knowledge_base
  question: What billing policies do we have written down?
  answer_channel: roi-sandbox-questions
  question_ts: '{{ refs.question_thread }}'
  tag_options:
  - billing
  - hiring
  - infrastructure
  - legal
  - security
fixtures:
  slack:
    threads:
    - ref: question_thread
      channel: roi-sandbox-questions
      messages:
      - user: Tomas
        text: What billing policies do we have written down?
  notion:
    databases:
    - name: knowledge_base
      pages:
      - ref: page_01
        title: Offer Approval Workflow
        properties:
          Tags:
          - hiring
          Summary: Offers above band need VP and finance sign-off.
      - ref: page_02
        title: Kubernetes Upgrade Runbook
        properties:
          Tags:
          - infrastructure
          Summary: Clusters upgrade one minor version per quarter.
      - ref: page_03
        title: Invoice Schedule
        properties:
          Tags:
          - billing
          Summary: Invoices are issued on the first business day of each month.
      - ref: page_04
        title: Incident Disclosure Process
        properties:
          Tags:
          - security
          Summary: Customer-facing incidents are disclosed within 72 hours.
      - ref: page_05
        title: Data Processing Agreement
        properties:
          Tags:
          - legal
          Summary: The standard DPA covers GDPR and CCPA obligations.
      - ref: page_06
        title: Backup Retention Matrix
        properties:
          Tags:
          - infrastructure
          Summary: Database backups are kept 35 days, snapshots 7 days.
      - ref: page_07
        title: Region Failover Plan
        properties:
          Tags:
          - infrastructure
          Summary: Traffic fails over to the secondary region within 15 minutes.
      - ref: page_08
        title: Dunning Email Sequence
        properties:
          Tags:
          - billing
          Summary: Failed payments trigger three reminder emails over 14 days.
      - ref: page_09
        title: Laptop Encryption Standard
        properties:
          Tags:
          - security
          Summary: All laptops use full-disk encryption enforced by MDM.
      - ref: page_10
        title: Refund Approval Rules
        properties:
          Tags:
          - billing
          Summary: Refunds above 500 USD need finance approval.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id001
      - Invoice Schedule
      - Dunning Email Sequence
      - Refund Approval Rules
  - name: message_excludes_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id002
      - Kubernetes Upgrade Runbook
      - Backup Retention Matrix
      - Region Failover Plan
      - Laptop Encryption Standard
      - Offer Approval Workflow
      - Incident Disclosure Process
      - Data Processing Agreement
  step_checks:
    extract_filter:
    - check: json_field_equals
      args:
        field: tag
        value: billing
    compose_answer:
    - check: text_mentions_terms
      args:
        terms: *id001
    - check: text_excludes_terms
      args:
        terms: *id002
  gold_outputs:
    extract_filter:
      tag: billing
    query_kb:
      pages:
      - title: Invoice Schedule
        properties:
          Tags:
          - billing
          Summary: Invoices are issued on the first business day of each month.
      - title: Dunning Email Sequence
        properties:
          Tags:
          - billing
          Summary: Failed payments trigger three reminder emails over 14 days.
      - title: Refund Approval Rules
        properties:
          Tags:
          - billing
          Summary: Refunds above 500 USD need finance approval.
