version: 1
task_id: slack_digest_012
workflow_id: slack_digest
instruction: Read the Slack thread with thread_ts {{ refs.thread_main }} in channel roi-sandbox-eng (a
  discussion about the support ticket backlog). Write a digest under 150 words that lists every decision
  and every action item with its owner's name and due date exactly as written, then post the digest as
  a new message in channel roi-sandbox-digest.
inputs:
  source_channel: roi-sandbox-eng
  thread_ts: '{{ refs.thread_main }}'
  digest_channel: roi-sandbox-digest
  topic: the support ticket backlog
fixtures:
  slack:
    threads:
    - ref: thread_main
      channel: roi-sandbox-eng
      messages:
      - user: Ravi
        text: Kicking off a thread on the support ticket backlog. We need to settle triage ownership and
          the response target today.
      - user: Samir
        text: For triage ownership I'd lean toward a shared queue, but I'm open to a weekly triage captain.
      - user: Priya
        text: a weekly triage captain is the safer choice given what we saw last quarter.
      - user: Ravi
        text: 'Agreed. Decision: we go with a weekly triage captain for triage ownership.'
      - user: Samir
        text: 'On the response target: 48 hours was floated, but the group prefers a 24-hour first-response
          target. Decision: a 24-hour first-response target.'
      - user: Ravi
        text: 'Action items: Samir will close duplicate tickets by Jan 10.'
      - user: Priya
        text: I'll set up the triage dashboard by Mar 9.
      - user: Ravi
        text: And Elena is on point to update the help center by May 28.
      - user: Elena
        text: Works for me, thanks all.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-digest
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-digest
      terms: &id001
      - weekly triage captain
      - 24-hour first-response target
      - Samir
      - Priya
      - Elena
      - Jan 10
      - Mar 9
      - May 28
  step_checks:
    write_digest:
    - check: text_mentions_terms
      args:
        terms: *id001
  gold_outputs: {}
