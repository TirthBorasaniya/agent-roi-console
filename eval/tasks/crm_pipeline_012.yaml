      domain: vandelay.roi-sandbox.test
    - ref: co_5
      name: Soylent Labs
      domain: soylent.roi-sandbox.test
    people:
    - ref: p_1
      first_name: Felix
      last_name: Morales
      email: felix.morales@globex.roi-sandbox.test
      company: co_1
      job_title: Procurement Lead
    - ref: p_2
      first_name: Diego
