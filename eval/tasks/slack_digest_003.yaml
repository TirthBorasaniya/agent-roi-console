version: 1
task_id: slack_digest_003
workflow_id: slack_digest
instruction: Read the Slack thread with thread_ts {{ refs.thread_main }} in channel roi-sandbox-eng (a
  discussion about the on-call rotation). Write a digest under 150 words that lists every decision and
  every action item with its owner's name and due date exactly as written, then post the digest as a new
  message in channel roi-sandbox-digest.
inputs:
  source_channel: roi-sandbox-eng
  thread_ts: '{{ refs.thread_main }}'
  digest_channel: roi-sandbox-digest
  topic: the on-call rotation
fixtures:
  slack:
    threads:
    - ref: thread_main
      channel: roi-sandbox-eng
      messages:
      - user: Hana
        text: Kicking off a thread on the on-call rotation. We need to settle the rotation length and
          the paging tool today.
      - user: Chloe
        text: For the rotation length I'd lean toward two weeks, but I'm open to one-week shifts.
      - user: Ingrid
        text: one-week shifts is the safer choice given what we saw last quarter.
      - user: Hana
        text: 'Agreed. Decision: we go with one-week shifts for the rotation length.'
      - user: Chloe
        text: 'On the paging tool: email alerts was floated, but the group prefers PagerDuty escalation.
          Decision: PagerDuty escalation.'
      - user: Hana
        text: 'Action items: Chloe will publish the new schedule by Nov 9.'
      - user: Ingrid
        text: I'll configure escalation policies by Mar 26.
      - user: Hana
        text: And Elena is on point to run a fire drill by Dec 7.
      - user: Elena
        text: Works for me, thanks all.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-digest
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-digest
      terms: &id001
      - one-week shifts
      - PagerDuty escalation
      - Chloe
      - Ingrid
      - Elena
      - Nov 9
      - Mar 26
      - Dec 7
  step_checks:
    write_digest:
    - check: text_mentions_terms
      args:
        terms: *id001
  gold_outputs: {}
