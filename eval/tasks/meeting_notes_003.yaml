version: 1
task_id: meeting_notes_003
workflow_id: meeting_notes
instruction: 'Create a page in the Notion database meeting_notes for the meeting notes below. Use the
  meeting title from the first line as the page title, set the Date property (YYYY-MM-DD) and the Attendees
  property (list of first names), then append blocks to the page: one paragraph block per decision and
  one to_do block per action item in the form "<Owner>: <task> (due <due>)". Notes: Pricing Committee

  Held on November 9, 2026

  Attendees: Tomas, Marcus, Felix


  Discussion

  Tomas opened with a status update. The group reviewed open risks and agreed:

  - Require design review for every new screen

  - Adopt the new on-call handbook


  Next steps

  - Tomas to prepare the budget estimate by Aug 7

  - Felix to update the roadmap slide by Mar 15

  '
inputs:
  meetings_database: meeting_notes
  notes: 'Pricing Committee

    Held on November 9, 2026

    Attendees: Tomas, Marcus, Felix


    Discussion

    Tomas opened with a status update. The group reviewed open risks and agreed:

    - Require design review for every new screen

    - Adopt the new on-call handbook


    Next steps

    - Tomas to prepare the budget estimate by Aug 7

    - Felix to update the roadmap slide by Mar 15

    '
fixtures:
  notion:
    databases:
    - name: meeting_notes
      pages: []
expected:
  validators:
  - name: notion_page_created
    args:
      database: meeting_notes
      title_contains: Pricing Committee
  - name: notion_property_equals
    args:
      database: meeting_notes
      title_contains: Pricing Committee
      property: Date
      value: '2026-11-09'
  - name: notion_todos_mention
    args:
      database: meeting_notes
      title_contains: Pricing Committee
      terms: &id001
      - Tomas
      - Felix
      min_todos: 2
  step_checks:
    extract_meeting:
    - check: json_field_contains
      args:
        field: title
        value: Pricing Committee
    - check: json_field_equals
      args:
        field: date
        value: '2026-11-09'
    - check: json_list_equals
      args:
        field: attendees
        value:
        - Tomas
        - Marcus
        - Felix
    - check: json_list_field_equals
      args:
        field: action_items
        key: owner
        value: *id001
  gold_outputs: {}
