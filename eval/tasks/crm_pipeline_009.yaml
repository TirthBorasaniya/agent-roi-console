      company: co_2
      point_of_contact: p_2
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-pipeline
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-pipeline
      terms:
      - Wonka Multi-region Rollout 1
      - Acme Multi-region Rollout 2
      - Globex Support Upgrade 3
      - Soylent Pilot Program 4
      - Cyberdyne Pilot Program 5
      - Wonka Seat Expansion 6
      - Acme Support Upgrade 7
  - name: message_mentions_amount
    args:
      channel: roi-sandbox-pipeline
      amount: 734500
  - name: crm_activity_logged
    args:
      contact: '{{ refs.p_4 }}'
      contains: pipeline
  step_checks:
    write_summary:
    - check: text_mentions_terms
      args:
        terms:
        - Wonka Multi-region Rollout 1
        - Acme Multi-region Rollout 2
        - Globex Support Upgrade 3
        - Soylent Pilot Program 4
        - Cyberdyne Pilot Program 5
        - Wonka Seat Expansion 6
        - Acme Support Upgrade 7
    - check: text_mentions_amount
      args:
        amount: 734500
    pick_followup:
    - check: json_field_equals
      args:
        field: contact_id
        value: '{{ refs.p_4 }}'
  gold_outputs: {}
