    - ref: opp_6
      name: Wonka Seat Expansion 6
      stage: SCREENING
      amount: 96500
      currency: USD
      company: co_1
      point_of_contact: p_1
    - ref: opp_7
      name: Acme Support Upgrade 7
      stage: NEW
      amount: 79000
