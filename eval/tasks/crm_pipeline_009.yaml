version: 1
task_id: crm_pipeline_009
workflow_id: crm_pipeline
instruction: List the open CRM opportunities. Post a pipeline summary to Slack channel roi-sandbox-pipeline
  that names every one of those opportunities by its exact name with its amount and stage and states their
  total amount in USD. Then log a CRM activity on the point of contact of the opportunity with the largest
  amount, with a note that contains the word "pipeline".
inputs:
  stage: null
  summary_channel: roi-sandbox-pipeline
fixtures:
  crm:
    companies:
    - ref: co_1
      name: Wonka Brands
      domain: wonka.roi-sandbox.test
    - ref: co_2
      name: Acme Robotics
      domain: acme.roi-sandbox.test
    - ref: co_3
      name: Globex Logistics
      domain: globex.roi-sandbox.test
    - ref: co_4
      name: Soylent Labs
      domain: soylent.roi-sandbox.test
    - ref: co_5
      name: Cyberdyne Energy
      domain: cyberdyne.roi-sandbox.test
    people:
    - ref: p_1
      first_name: Tomas
      last_name: Brandt
      email: tomas.brandt@wonka.roi-sandbox.test
      company: co_1
      job_title: Procurement Lead
    - ref: p_2
      first_name: Maya
      last_name: Aziz
      email: maya.aziz@acme.roi-sandbox.test
      company: co_2
      job_title: VP Operations
    - ref: p_3
      first_name: Hana
      last_name: Brandt
      email: hana.brandt@globex.roi-sandbox.test
      company: co_3
      job_title: CTO
    - ref: p_4
      first_name: Omar
      last_name: Morales
      email: omar.morales@soylent.roi-sandbox.test
      company: co_4
      job_title: Head of IT
    - ref: p_5
      first_name: Lena
      last_name: Larsen
      email: lena.larsen@cyberdyne.roi-sandbox.test
      company: co_5
      job_title: Head of IT
    opportunities:
    - ref: opp_1
      name: Wonka Multi-region Rollout 1
      stage: PROPOSAL
      amount: 103500
      currency: USD
      company: co_1
      point_of_contact: p_1
    - ref: opp_2
      name: Acme Multi-region Rollout 2
      stage: PROPOSAL
      amount: 110000
      currency: USD
      company: co_2
      point_of_contact: p_2
    - ref: opp_3
      name: Globex Support Upgrade 3
      stage: SCREENING
      amount: 136000
      currency: USD
      company: co_3
