version: 1
task_id: meeting_notes_009
workflow_id: meeting_notes
instruction: 'Create a page in the Notion database meeting_notes for the meeting notes below. Use the
  meeting title from the first line as the page title, set the Date property (YYYY-MM-DD) and the Attendees
  property (list of first names), then append blocks to the page: one paragraph block per decision and
  one to_do block per action item in the form "<Owner>: <task> (due <due>)". Notes: Hiring Committee

  Held on April 23, 2026

  Attendees: Hana, Priya, Ravi, Lena


  Discussion

  Hana opened with a status update. The group reviewed open risks and agreed:

  - Move the launch to the second week of the month

  - Adopt the new on-call handbook


  Next steps

  - Lena to send the recap to stakeholders by Nov 6

  - Ravi to prepare the budget estimate by Dec 24

  '
inputs:
  meetings_database: meeting_notes
  notes: 'Hiring Committee

    Held on April 23, 2026

    Attendees: Hana, Priya, Ravi, Lena


    Discussion

    Hana opened with a status update. The group reviewed open risks and agreed:

    - Move the launch to the second week of the month

    - Adopt the new on-call handbook


    Next steps

    - Lena to send the recap to stakeholders by Nov 6

    - Ravi to prepare the budget estimate by Dec 24

    '
fixtures:
  notion:
    databases:
    - name: meeting_notes
      pages: []
expected:
  validators:
  - name: notion_page_created
    args:
      database: meeting_notes
      title_contains: Hiring Committee
  - name: notion_property_equals
    args:
      database: meeting_notes
      title_contains: Hiring Committee
      property: Date
      value: '2026-04-23'
  - name: notion_todos_mention
    args:
      database: meeting_notes
      title_contains: Hiring Committee
      terms: &id001
      - Lena
      - Ravi
      min_todos: 2
  step_checks:
    extract_meeting:
    - check: json_field_contains
      args:
        field: title
        value: Hiring Committee
    - check: json_field_equals
      args:
        field: date
        value: '2026-04-23'
    - check: json_list_equals
      args:
        field: attendees
        value:
        - Hana
        - Priya
        - Ravi
        - Lena
    - check: json_list_field_equals
      args:
        field: action_items
        key: owner
        value: *id001
  gold_outputs: {}
