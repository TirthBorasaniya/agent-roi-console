version: 1
task_id: notion_search_005
workflow_id: notion_search
instruction: 'A teammate asked in Slack channel roi-sandbox-questions (thread_ts {{ refs.question_thread
  }}): "What hiring policies are documented?". Query the Notion database knowledge_base using a filter
  on the Tags multi_select property (allowed tags: billing, hiring, infrastructure, onboarding, security),
  then reply in that thread with an answer under 120 words that names every relevant page by its exact
  title and no other pages.'
inputs:
  kb_database: knowledge_base
  question: What hiring policies are documented?
  answer_channel: roi-sandbox-questions
  question_ts: '{{ refs.question_thread }}'
  tag_options:
  - billing
  - hiring
  - infrastructure
  - onboarding
  - security
fixtures:
  slack:
    threads:
    - ref: question_thread
      channel: roi-sandbox-questions
      messages:
      - user: Samir
        text: What hiring policies are documented?
  notion:
    databases:
    - name: knowledge_base
      pages:
      - ref: page_01
        title: Password Rotation Policy
        properties:
          Tags:
          - security
          Summary: Service passwords rotate every 90 days through Vault.
      - ref: page_02
        title: Access Review Checklist
        properties:
          Tags:
          - security
          Summary: Admin access is reviewed quarterly by each team lead.
      - ref: page_03
        title: Incident Disclosure Process
        properties:
          Tags:
          - security
          Summary: Customer-facing incidents are disclosed within 72 hours.
      - ref: page_04
        title: Region Failover Plan
        properties:
          Tags:
          - infrastructure
          Summary: Traffic fails over to the secondary region within 15 minutes.
      - ref: page_05
        title: Invoice Schedule
        properties:
          Tags:
          - billing
          Summary: Invoices are issued on the first business day of each month.
      - ref: page_06
        title: Offer Approval Workflow
        properties:
          Tags:
          - hiring
          Summary: Offers above band need VP and finance sign-off.
      - ref: page_07
        title: Buddy Program Guide
        properties:
          Tags:
          - onboarding
          Summary: Every new hire is paired with a buddy for 30 days.
      - ref: page_08
        title: Referral Bonus Policy
        properties:
          Tags:
          - hiring
          Summary: Referral bonuses pay out after the hire's 90th day.
      - ref: page_09
        title: Backup Retention Matrix
        properties:
          Tags:
          - infrastructure
          Summary: Database backups are kept 35 days, snapshots 7 days.
      - ref: page_10
        title: New Hire First Week
        properties:
          Tags:
          - onboarding
          Summary: Day-by-day schedule for a new engineer's first week.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id001
      - Offer Approval Workflow
      - Referral Bonus Policy
  - name: message_excludes_terms
    args:
      channel: roi-sandbox-questions
      thread_ts: '{{ refs.question_thread }}'
      terms: &id002
      - Region Failover Plan
      - Buddy Program Guide
      - New Hire First Week
      - Access Review Checklist
      - Incident Disclosure Process
      - Invoice Schedule
      - Backup Retention Matrix
      - Password Rotation Policy
  step_checks:
    extract_filter:
    - check: json_field_equals
      args:
        field: tag
        value: hiring
    compose_answer:
    - check: text_mentions_terms
      args:
        terms: *id001
    - check: text_excludes_terms
      args:
        terms: *id002
  gold_outputs:
    extract_filter:
      tag: hiring
    query_kb:
      pages:
      - title: Offer Approval Workflow
        properties:
          Tags:
          - hiring
          Summary: Offers above band need VP and finance sign-off.
      - title: Referral Bonus Policy
        properties:
          Tags:
          - hiring
          Summary: Referral bonuses pay out after the hire's 90th day.
