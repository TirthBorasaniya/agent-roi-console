version: 1
task_id: slack_digest_005
workflow_id: slack_digest
instruction: Read the Slack thread with thread_ts {{ refs.thread_main }} in channel roi-sandbox-eng (a
  discussion about the observability vendor). Write a digest under 150 words that lists every decision
  and every action item with its owner's name and due date exactly as written, then post the digest as
  a new message in channel roi-sandbox-digest.
inputs:
  source_channel: roi-sandbox-eng
  thread_ts: '{{ refs.thread_main }}'
  digest_channel: roi-sandbox-digest
  topic: the observability vendor
fixtures:
  slack:
    threads:
    - ref: thread_main
      channel: roi-sandbox-eng
      messages:
      - user: Marcus
        text: Kicking off a thread on the observability vendor. We need to settle the tracing backend
          and log retention today.
      - user: Aisha
        text: For the tracing backend I'd lean toward a self-built stack, but I'm open to Grafana Tempo.
      - user: Kenji
        text: Grafana Tempo is the safer choice given what we saw last quarter.
      - user: Marcus
        text: 'Agreed. Decision: we go with Grafana Tempo for the tracing backend.'
      - user: Aisha
        text: 'On log retention: 90 days was floated, but the group prefers 30-day log retention. Decision:
          30-day log retention.'
      - user: Marcus
        text: 'Action items: Aisha will sign the vendor contract by Jul 27.'
      - user: Kenji
        text: I'll migrate the dashboards by Mar 9.
      - user: Marcus
        text: And Diego is on point to decommission the old agent by Sep 16.
      - user: Diego
        text: Works for me, thanks all.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-digest
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-digest
      terms: &id001
      - Grafana Tempo
      - 30-day log retention
      - Aisha
      - Kenji
      - Diego
      - Jul 27
      - Mar 9
      - Sep 16
  step_checks:
    write_digest:
    - check: text_mentions_terms
      args:
        terms: *id001
  gold_outputs: {}
