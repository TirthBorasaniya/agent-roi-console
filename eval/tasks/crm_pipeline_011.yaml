      company: co_4
      job_title: CTO
    - ref: p_5
      first_name: Daniel
      last_name: Morales
      email: daniel.morales@acme.roi-sandbox.test
      company: co_5
      job_title: Procurement Lead
    opportunities:
    - ref: opp_1
      name: Globex Enterprise License 1
      stage: SCREENING
      amount: 98500
