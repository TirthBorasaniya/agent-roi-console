    - ref: co_4
      name: Soylent Labs
      domain: soylent.roi-sandbox.test
    - ref: co_5
      name: Acme Robotics
      domain: acme.roi-sandbox.test
    people:
    - ref: p_1
      first_name: Kenji
      last_name: Chen
      email: kenji.chen@globex.roi-sandbox.test
      company: co_1
      job_title: CTO
    - ref: p_2
      first_name: Marcus
      last_name: Novak
      email: marcus.novak@oscorp.roi-sandbox.test
      company: co_2
      job_title: VP Operations
    - ref: p_3
      first_name: Tomas
      last_name: Khan
      email: tomas.khan@tyrell.roi-sandbox.test
      company: co_3
      job_title: CTO
    - ref: p_4
      first_name: Diego
