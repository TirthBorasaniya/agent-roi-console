expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-pipeline
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-pipeline
      terms:
      - Globex Enterprise License 1
      - Tyrell Platform Expansion 3
      - Soylent Annual Renewal 4
      - Acme Analytics Add-on 5
      - Oscorp Seat Expansion 7
  - name: message_mentions_amount
    args:
      channel: roi-sandbox-pipeline
      amount: 374500
  - name: crm_activity_logged
    args:
      contact: '{{ refs.p_1 }}'
      contains: pipeline
  step_checks:
    write_summary:
    - check: text_mentions_terms
      args:
        terms:
        - Globex Enterprise License 1
        - Tyrell Platform Expansion 3
        - Soylent Annual Renewal 4
        - Acme Analytics Add-on 5
        - Oscorp Seat Expansion 7
    - check: text_mentions_amount
      args:
        amount: 374500
    pick_followup:
    - check: json_field_equals
      args:
        field: contact_id
        value: '{{ refs.p_1 }}'
  gold_outputs: {}
