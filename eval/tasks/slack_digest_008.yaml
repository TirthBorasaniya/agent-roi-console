version: 1
task_id: slack_digest_008
workflow_id: slack_digest
instruction: Read the Slack thread with thread_ts {{ refs.thread_main }} in channel roi-sandbox-eng (a
  discussion about the data warehouse costs). Write a digest under 150 words that lists every decision
  and every action item with its owner's name and due date exactly as written, then post the digest as
  a new message in channel roi-sandbox-digest.
inputs:
  source_channel: roi-sandbox-eng
  thread_ts: '{{ refs.thread_main }}'
  digest_channel: roi-sandbox-digest
  topic: the data warehouse costs
fixtures:
  slack:
    threads:
    - ref: thread_main
      channel: roi-sandbox-eng
      messages:
      - user: Nadia
        text: Kicking off a thread on the data warehouse costs. We need to settle the compute plan and
          stale tables today.
      - user: Hana
        text: For the compute plan I'd lean toward on-demand only, but I'm open to reserved capacity.
      - user: Felix
        text: reserved capacity is the safer choice given what we saw last quarter.
      - user: Nadia
        text: 'Agreed. Decision: we go with reserved capacity for the compute plan.'
      - user: Hana
        text: 'On stale tables: keep everything was floated, but the group prefers a 180-day table expiry.
          Decision: a 180-day table expiry.'
      - user: Nadia
        text: 'Action items: Hana will tag tables by owner by Jan 3.'
      - user: Felix
        text: I'll cancel unused pipelines by Jan 16.
      - user: Nadia
        text: And Chloe is on point to report monthly spend by Dec 11.
      - user: Chloe
        text: Works for me, thanks all.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-digest
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-digest
      terms: &id001
      - reserved capacity
      - 180-day table expiry
      - Hana
      - Felix
      - Chloe
      - Jan 3
      - Jan 16
      - Dec 11
  step_checks:
    write_digest:
    - check: text_mentions_terms
      args:
        terms: *id001
  gold_outputs: {}
