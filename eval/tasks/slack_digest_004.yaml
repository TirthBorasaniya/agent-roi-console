version: 1
task_id: slack_digest_004
workflow_id: slack_digest
instruction: Read the Slack thread with thread_ts {{ refs.thread_main }} in channel roi-sandbox-eng (a
  discussion about the Q3 pricing change). Write a digest under 150 words that lists every decision and
  every action item with its owner's name and due date exactly as written, then post the digest as a new
  message in channel roi-sandbox-digest.
inputs:
  source_channel: roi-sandbox-eng
  thread_ts: '{{ refs.thread_main }}'
  digest_channel: roi-sandbox-digest
  topic: the Q3 pricing change
fixtures:
  slack:
    threads:
    - ref: thread_main
      channel: roi-sandbox-eng
      messages:
      - user: Marcus
        text: Kicking off a thread on the Q3 pricing change. We need to settle the starter tier price
          and grandfathering today.
      - user: Ravi
        text: For the starter tier price I'd lean toward 19 dollars, but I'm open to the Starter Plus
          tier.
      - user: Omar
        text: the Starter Plus tier is the safer choice given what we saw last quarter.
      - user: Marcus
        text: 'Agreed. Decision: we go with the Starter Plus tier for the starter tier price.'
      - user: Ravi
        text: 'On grandfathering: no grandfathering was floated, but the group prefers a grandfather period.
          Decision: a grandfather period.'
      - user: Marcus
        text: 'Action items: Ravi will update the pricing page by Aug 13.'
      - user: Omar
        text: I'll email existing customers by Jun 22.
      - user: Marcus
        text: And Nadia is on point to change the billing plans by Jan 2.
      - user: Nadia
        text: Works for me, thanks all.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-digest
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-digest
      terms: &id001
      - Starter Plus tier
      - grandfather period
      - Ravi
      - Omar
      - Nadia
      - Aug 13
      - Jun 22
      - Jan 2
  step_checks:
    write_digest:
    - check: text_mentions_terms
      args:
        terms: *id001
  gold_outputs: {}
