version: 1
task_id: slack_digest_007
workflow_id: slack_digest
instruction: Read the Slack thread with thread_ts {{ refs.thread_main }} in channel roi-sandbox-eng (a
  discussion about the customer onboarding flow). Write a digest under 150 words that lists every decision
  and every action item with its owner's name and due date exactly as written, then post the digest as
  a new message in channel roi-sandbox-digest.
inputs:
  source_channel: roi-sandbox-eng
  thread_ts: '{{ refs.thread_main }}'
  digest_channel: roi-sandbox-digest
  topic: the customer onboarding flow
fixtures:
  slack:
    threads:
    - ref: thread_main
      channel: roi-sandbox-eng
      messages:
      - user: Jonah
        text: Kicking off a thread on the customer onboarding flow. We need to settle the signup step
          count and email verification today.
      - user: Kenji
        text: For the signup step count I'd lean toward five steps, but I'm open to a three-step signup.
      - user: Diego
        text: a three-step signup is the safer choice given what we saw last quarter.
      - user: Jonah
        text: 'Agreed. Decision: we go with a three-step signup for the signup step count.'
      - user: Kenji
        text: 'On email verification: verify first was floated, but the group prefers deferred email verification.
          Decision: deferred email verification.'
      - user: Jonah
        text: 'Action items: Kenji will ship the new signup form by Jan 6.'
      - user: Diego
        text: I'll add funnel analytics by Mar 16.
      - user: Jonah
        text: And Elena is on point to rewrite the welcome email by Apr 20.
      - user: Elena
        text: Works for me, thanks all.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-digest
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-digest
      terms: &id001
      - three-step signup
      - deferred email verification
      - Kenji
      - Diego
      - Elena
      - Jan 6
      - Mar 16
      - Apr 20
  step_checks:
    write_digest:
    - check: text_mentions_terms
      args:
        terms: *id001
  gold_outputs: {}
