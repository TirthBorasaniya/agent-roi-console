version: 1
task_id: slack_digest_015
workflow_id: slack_digest
instruction: Read the Slack thread with thread_ts {{ refs.thread_main }} in channel roi-sandbox-eng (a
  discussion about the laptop refresh). Write a digest under 150 words that lists every decision and every
  action item with its owner's name and due date exactly as written, then post the digest as a new message
  in channel roi-sandbox-digest.
inputs:
  source_channel: roi-sandbox-eng
  thread_ts: '{{ refs.thread_main }}'
  digest_channel: roi-sandbox-digest
  topic: the laptop refresh
fixtures:
  slack:
    threads:
    - ref: thread_main
      channel: roi-sandbox-eng
      messages:
      - user: Ravi
        text: Kicking off a thread on the laptop refresh. We need to settle the standard model and device
          management today.
      - user: Chloe
        text: For the standard model I'd lean toward 15-inch laptops, but I'm open to 14-inch M4 laptops.
      - user: Felix
        text: 14-inch M4 laptops is the safer choice given what we saw last quarter.
      - user: Ravi
        text: 'Agreed. Decision: we go with 14-inch M4 laptops for the standard model.'
      - user: Chloe
        text: 'On device management: manual setup was floated, but the group prefers Kandji enrollment.
          Decision: Kandji enrollment.'
      - user: Ravi
        text: 'Action items: Chloe will order the laptops by Jan 14.'
      - user: Felix
        text: I'll prepare the setup guide by May 12.
      - user: Ravi
        text: And Samir is on point to collect the old devices by Jul 27.
      - user: Samir
        text: Works for me, thanks all.
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-digest
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-digest
      terms: &id001
      - 14-inch M4 laptops
      - Kandji enrollment
      - Chloe
      - Felix
      - Samir
      - Jan 14
      - May 12
      - Jul 27
  step_checks:
    write_digest:
    - check: text_mentions_terms
      args:
        terms: *id001
  gold_outputs: {}
