version: 1
task_id: meeting_notes_004
workflow_id: meeting_notes
instruction: 'Create a page in the Notion database meeting_notes for the meeting notes below. Use the
  meeting title from the first line as the page title, set the Date property (YYYY-MM-DD) and the Attendees
  property (list of first names), then append blocks to the page: one paragraph block per decision and
  one to_do block per action item in the form "<Owner>: <task> (due <due>)". Notes: Security Council

  Held on November 21, 2026

  Attendees: Samir, Diego, Chloe, Hana, Ingrid


  Discussion

  Samir opened with a status update. The group reviewed open risks and agreed:

  - Fund the observability upgrade

  - Run the beta with five design partners


  Next steps

  - Chloe to prepare the budget estimate by Aug 25

  - Hana to send the recap to stakeholders by Apr 27

  - Ingrid to draft the customer announcement by Jun 15

  '
inputs:
  meetings_database: meeting_notes
  notes: 'Security Council

    Held on November 21, 2026

    Attendees: Samir, Diego, Chloe, Hana, Ingrid


    Discussion

    Samir opened with a status update. The group reviewed open risks and agreed:

    - Fund the observability upgrade

    - Run the beta with five design partners


    Next steps

    - Chloe to prepare the budget estimate by Aug 25

    - Hana to send the recap to stakeholders by Apr 27

    - Ingrid to draft the customer announcement by Jun 15

    '
fixtures:
  notion:
    databases:
    - name: meeting_notes
      pages: []
expected:
  validators:
  - name: notion_page_created
    args:
      database: meeting_notes
      title_contains: Security Council
  - name: notion_property_equals
    args:
      database: meeting_notes
      title_contains: Security Council
      property: Date
      value: '2026-11-21'
  - name: notion_todos_mention
    args:
      database: meeting_notes
      title_contains: Security Council
      terms: &id001
      - Chloe
      - Hana
      - Ingrid
      min_todos: 3
  step_checks:
    extract_meeting:
    - check: json_field_contains
      args:
        field: title
        value: Security Council
    - check: json_field_equals
      args:
        field: date
        value: '2026-11-21'
    - check: json_list_equals
      args:
        field: attendees
        value:
        - Samir
        - Diego
        - Chloe
        - Hana
        - Ingrid
    - check: json_list_field_equals
      args:
        field: action_items
        key: owner
        value: *id001
  gold_outputs: {}
