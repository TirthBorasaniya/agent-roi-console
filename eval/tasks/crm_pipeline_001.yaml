version: 1
task_id: crm_pipeline_001
workflow_id: crm_pipeline
instruction: List the open CRM opportunities. Post a pipeline summary to Slack channel roi-sandbox-pipeline
  that names every one of those opportunities by its exact name with its amount and stage and states their
  total amount in USD. Then log a CRM activity on the point of contact of the opportunity with the largest
  amount, with a note that contains the word "pipeline".
inputs:
  stage: null
  summary_channel: roi-sandbox-pipeline
fixtures:
  crm:
    companies:
    - ref: co_1
      name: Umbrella Retail
      domain: umbrella.roi-sandbox.test
    - ref: co_2
      name: Acme Robotics
      domain: acme.roi-sandbox.test
    - ref: co_3
      name: Globex Logistics
      domain: globex.roi-sandbox.test
    - ref: co_4
      name: Gringotts Finance
      domain: gringotts.roi-sandbox.test
    - ref: co_5
      name: Initech Health
      domain: initech.roi-sandbox.test
    people:
    - ref: p_1
      first_name: Lena
      last_name: Iyer
      email: lena.iyer@umbrella.roi-sandbox.test
      company: co_1
      job_title: VP Operations
    - ref: p_2
      first_name: Priya
      last_name: Tanaka
      email: priya.tanaka@acme.roi-sandbox.test
      company: co_2
      job_title: VP Operations
    - ref: p_3
      first_name: Elena
      last_name: Nair
      email: elena.nair@globex.roi-sandbox.test
      company: co_3
      job_title: Head of IT
    - ref: p_4
      first_name: Samir
      last_name: Petrov
      email: samir.petrov@gringotts.roi-sandbox.test
      company: co_4
      job_title: Procurement Lead
    - ref: p_5
      first_name: Jonah
      last_name: Rossi
      email: jonah.rossi@initech.roi-sandbox.test
      company: co_5
      job_title: Procurement Lead
    opportunities:
    - ref: opp_1
      name: Umbrella Enterprise License 1
      stage: CUSTOMER
      amount: 92000
      currency: USD
      company: co_1
      point_of_contact: p_1
    - ref: opp_2
      name: Acme Pilot Program 2
      stage: NEW
      amount: 134500
      currency: USD
      company: co_2
      point_of_contact: p_2
    - ref: opp_3
      name: Globex Pilot Program 3
      stage: PROPOSAL
      amount: 61000
      currency: USD
      company: co_3
      point_of_contact: p_3
    - ref: opp_4
      name: Gringotts Multi-region Rollout 4
      stage: NEW
      amount: 24500
      currency: USD
      company: co_4
      point_of_contact: p_4
    - ref: opp_5
      name: Initech Pilot Program 5
      stage: MEETING
      amount: 89500
      currency: USD
      company: co_5
      point_of_contact: p_5
    - ref: opp_6
      name: Umbrella Pilot Program 6
      stage: CUSTOMER
      amount: 36000
      currency: USD
      company: co_1
      point_of_contact: p_1
    - ref: opp_7
      name: Acme Platform Expansion 7
      stage: MEETING
      amount: 51500
      currency: USD
      company: co_2
      point_of_contact: p_2
expected:
  validators:
  - name: slack_message_posted
    args:
      channel: roi-sandbox-pipeline
  - name: message_mentions_terms
    args:
      channel: roi-sandbox-pipeline
      terms:
      - Acme Pilot Program 2
      - Globex Pilot Program 3
      - Gringotts Multi-region Rollout 4
      - Initech Pilot Program 5
      - Acme Platform Expansion 7
  - name: message_mentions_amount
    args:
      channel: roi-sandbox-pipeline
      amount: 361000
  - name: crm_activity_logged
    args:
      contact: '{{ refs.p_2 }}'
      contains: pipeline
  step_checks:
    write_summary:
    - check: text_mentions_terms
      args:
        terms:
        - Acme Pilot Program 2
        - Globex Pilot Program 3
        - Gringotts Multi-region Rollout 4
        - Initech Pilot Program 5
        - Acme Platform Expansion 7
    - check: text_mentions_amount
      args:
        amount: 361000
    pick_followup:
    - check: json_field_equals
      args:
        field: contact_id
        value: '{{ refs.p_2 }}'
  gold_outputs: {}
