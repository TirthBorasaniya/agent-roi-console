version: 1
task_id: meeting_notes_001
workflow_id: meeting_notes
instruction: 'Create a page in the Notion database meeting_notes for the meeting notes below. Use the
  meeting title from the first line as the page title, set the Date property (YYYY-MM-DD) and the Attendees
  property (list of first names), then append blocks to the page: one paragraph block per decision and
  one to_do block per action item in the form "<Owner>: <task> (due <due>)". Notes: Platform Weekly Sync

  Held on June 15, 2026

  Attendees: Priya, Kenji, Felix, Omar


  Discussion

  Priya opened with a status update. The group reviewed open risks and agreed:

  - Retire the legacy export endpoint

  - Move the launch to the second week of the month


  Next steps

  - Omar to draft the customer announcement by Dec 4

  - Priya to update the roadmap slide by Sep 16

  '
inputs:
  meetings_database: meeting_notes
  notes: 'Platform Weekly Sync

    Held on June 15, 2026

    Attendees: Priya, Kenji, Felix, Omar


    Discussion

    Priya opened with a status update. The group reviewed open risks and agreed:

    - Retire the legacy export endpoint

    - Move the launch to the second week of the month


    Next steps

    - Omar to draft the customer announcement by Dec 4

    - Priya to update the roadmap slide by Sep 16

    '
fixtures:
  notion:
    databases:
    - name: meeting_notes
      pages: []
expected:
  validators:
  - name: notion_page_created
    args:
      database: meeting_notes
      title_contains: Platform Weekly Sync
  - name: notion_property_equals
    args:
      database: meeting_notes
      title_contains: Platform Weekly Sync
      property: Date
      value: '2026-06-15'
  - name: notion_todos_mention
    args:
      database: meeting_notes
      title_contains: Platform Weekly Sync
      terms: &id001
      - Omar
      - Priya
      min_todos: 2
  step_checks:
    extract_meeting:
    - check: json_field_contains
      args:
        field: title
        value: Platform Weekly Sync
    - check: json_field_equals
      args:
        field: date
        value: '2026-06-15'
    - check: json_list_equals
      args:
        field: attendees
        value:
        - Priya
        - Kenji
        - Felix
        - Omar
    - check: json_list_field_equals
      args:
        field: action_items
        key: owner
        value: *id001
  gold_outputs: {}
